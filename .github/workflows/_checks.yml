name: Checks

on:
  workflow_call:
    inputs:
      cache-read-only:
        description: Читать кэш Gradle без записи
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  checks:
    name: Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ inputs.cache-read-only }}

      - name: Check for Gradle deprecations
        run: ./gradlew --warning-mode=fail help

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run all tests
        run: ./gradlew allTests
