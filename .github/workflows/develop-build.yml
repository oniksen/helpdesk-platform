name: Develop Build

on:
  push:
    branches:
      - develop

concurrency:
  group: build-develop
  cancel-in-progress: true

jobs:
  check:
    name: Code Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run all tests
        run: ./gradlew allTests

  build-windows:
    name: Build Windows
    needs: check
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create release distributable
        run: ./gradlew :composeApp:createReleaseDistributable

      - name: Package distributable as ZIP
        shell: powershell
        run: |
          Compress-Archive -Path composeApp/build/compose/binaries/main-release/app/* -DestinationPath helpdesk-windows-distributable.zip

      - name: Upload distributable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: helpdesk-windows-distributable
          path: helpdesk-windows-distributable.zip
          if-no-files-found: error
          retention-days: 7

      - name: Build MSI installer
        run: ./gradlew :composeApp:packageReleaseMsi

      - name: Package MSI as ZIP
        shell: powershell
        run: |
          Compress-Archive -Path composeApp/build/compose/binaries/main-release/msi/* -DestinationPath helpdesk-windows-msi.zip

      - name: Upload MSI ZIP
        uses: actions/upload-artifact@v4
        with:
          name: helpdesk-windows-msi
          path: helpdesk-windows-msi.zip
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS
    needs: check
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create release distributable
        run: ./gradlew :composeApp:createReleaseDistributable

      - name: Package distributable as ZIP
        run: zip -r helpdesk-macos-distributable.zip composeApp/build/compose/binaries/main-release/app/

      - name: Upload distributable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: helpdesk-macos-distributable
          path: helpdesk-macos-distributable.zip
          if-no-files-found: error
          retention-days: 7

      - name: Build DMG installer
        run: ./gradlew :composeApp:packageReleaseDmg

      - name: Package DMG as ZIP
        run: zip -r helpdesk-macos-dmg.zip composeApp/build/compose/binaries/main-release/dmg/

      - name: Upload DMG ZIP
        uses: actions/upload-artifact@v4
        with:
          name: helpdesk-macos-dmg
          path: helpdesk-macos-dmg.zip
          if-no-files-found: error
          retention-days: 7
