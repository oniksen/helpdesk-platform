name: PR Check

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Кэш из PR попадает в refs/pull/N/merge и доступен только повторным
          # прогонам этого же PR, поэтому пишем кэш только на push в develop.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Check for Gradle deprecations
        run: ./gradlew --warning-mode=fail help

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run all tests
        run: ./gradlew allTests

      - name: Build JS distribution
        run: ./gradlew :webApp:jsBrowserDevelopmentExecutableDistribution

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-js-dist
          path: dist
          retention-days: 1
          if-no-files-found: error

      - name: Build webShell distribution
        run: ./gradlew :webShell:jsBrowserDevelopmentExecutableDistribution

      - name: Upload webShell artifact
        uses: actions/upload-artifact@v4
        with:
          name: webshell-js-dist
          path: dist-shell
          retention-days: 1
          if-no-files-found: error