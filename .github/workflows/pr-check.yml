name: PR Check

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run all tests
        run: ./gradlew allTests

      - name: Build JS distribution
        run: ./gradlew :webApp:jsBrowserDevelopmentExecutableDistribution

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-js-dist
          path: dist
          retention-days: 2
          if-no-files-found: error