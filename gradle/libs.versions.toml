[versions]
composeMultiplatform = "1.12.0"
composeAdaptive = "1.3.0-beta02"
junit = "4.13.2"
kotlin = "2.4.10"
kotlinx-coroutines = "1.11.0"
kotlin-wrappers = "2026.8.4"
kover = "0.9.8"
material3 = "1.12.0-alpha03"
koin = "4.0.2"
multiplatform-nav3-ui = "1.1.1"
jb-compose-material-icons = "1.7.3"
ktor = "3.5.2"

[libraries]
# Compose core
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
jb-compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "jb-compose-material-icons" }

# Compose adaptive
compose-adaptive-core = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "composeAdaptive" }

# Navigation
jetbrains-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "multiplatform-nav3-ui" }

# Browser
wrappers-browser = { module = "org.jetbrains.kotlin-wrappers:kotlin-browser", version.ref = "kotlin-wrappers" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }

# Ktor
ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-js-client = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }

# Test
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }

[bundles]
# Только те библиотеки, что действительно используются вместе
compose = [
    "compose-foundation",
    "compose-runtime",
    "compose-material3",
    "compose-ui"
]
composeResources = [
    "compose-components-resources"
]
composeIcons = [
    "jb-compose-material-icons-extended"
]
composeAdaptive = [
    "compose-adaptive-core"
]
composePreview = [
    "compose-uiTooling",
    "compose-uiToolingPreview",
    "compose-ui"
]
koin = [
    "koin-core",
    "koin-compose"
]
ktor = [
    "ktor-core",
    "ktor-logging",
    "ktor-negotiation",
    "ktor-serialization",
    "ktor-auth"
]
ktorJvm = [
    "ktor-cio"
]
ktorJs = [
    "ktor-js-client"
]

[plugins]
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinx-kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }